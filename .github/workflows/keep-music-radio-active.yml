name: Keep Ilyusha music radio active

on:
  # Restart every two days, leaving room before the four-day free-plan timer.
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-hosting-music-radio-keepalive
  cancel-in-progress: false

jobs:
  restart-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BH_API_KEY: ${{ secrets.BOT_HOSTING_API_KEY }}
      BH_DEPLOYMENT_ID: ${{ vars.BOT_HOSTING_DEPLOYMENT_ID }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "${BH_API_KEY}" ]]; then
            echo "::error::Missing repository secret BOT_HOSTING_API_KEY"
            exit 1
          fi

          if [[ ! "${BH_DEPLOYMENT_ID}" =~ ^dep_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Missing or invalid repository variable BOT_HOSTING_DEPLOYMENT_ID"
            exit 1
          fi

      - name: Restart Bot-Hosting deployment
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "https://bot-hosting.net/api/v1/deployments/${BH_DEPLOYMENT_ID}/power" \
            -H "Authorization: Bearer ${BH_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"action":"restart","waitSeconds":45}')"

          # Print only non-secret status fields, not the full response or request.
          echo "${response}" | jq '{ok, action, reason, state, hint}'

          if ! echo "${response}" | jq -e '.ok == true and .state == "running"' >/dev/null; then
            echo "::error::Bot-Hosting did not confirm that the deployment returned to running state."
            exit 1
          fi

          echo "Bot-Hosting confirmed the deployment is running again."
